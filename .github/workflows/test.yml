name: Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ "debian:12", "debian:13" ]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Senza il modulo JSON di perl lo script deve fermarsi, non dare verde
        run: |
          if PATH="$PWD/tests/mock:$PATH" bash ./vm-pve-check.sh -q -o /tmp/x; then echo "doveva fermarsi"; exit 1; else echo "ok, si ferma"; fi
      - name: Test con API simulata (Debian come base di Proxmox VE 8 e 9)
        run: |
          apt-get update -q && apt-get install -y -q perl
          bash tests/run.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n vm-pve-check.sh
          shellcheck -S error vm-pve-check.sh tests/run.sh tests/mock/pvesh
